name: Lighthouse CI

# Runs on every PR targeting main. Waits for the Vercel preview deploy
# to be ready, then runs Lighthouse 5x against it and fails the check
# if median perf metrics regress past the budgets in lighthouserc.json.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  deployments: read
  statuses: read

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel preview deployment
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        id: vercel
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          environment: Preview

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.vercel.outputs.url }}
            ${{ steps.vercel.outputs.url }}/episodes
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
